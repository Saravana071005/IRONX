<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>IRON HOUSE</title>
<meta name="description" content="Personal gym & body weight tracker">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IRON HOUSE">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<script>
  window.__IH_START = performance.now();
  window.__IH_TIMINGS = { navStart: 0 };
  window.addEventListener('DOMContentLoaded', () => {
    if (window.__IH_TIMINGS) window.__IH_TIMINGS.htmlLoad = Math.round(performance.now() - (window.__IH_START || 0));
  });
</script>
</head>
<body style="background:#000000;margin:0;">
<div id="root">
  <div id="loading" style="background:#000000;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:rgba(235,235,245,0.32);font-family:-apple-system,BlinkMacSystemFont,sans-serif;">
    <div style="width:28px;height:28px;border:2.5px solid rgba(255,255,255,0.15);border-top-color:#A3E635;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
    <span style="font-size:12px;letter-spacing:0.08em;text-transform:uppercase;">Loading...</span>
  </div>
  <style>@keyframes spin{to{transform:rotate(360deg);}}</style>
</div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
