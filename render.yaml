services:
  # OpenGym Backend API Service (Node.js Web Service on Free Tier)
  - type: web
    name: opengym-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: opengym
      - key: SECRET
        generateValue: true
      - key: RP_NAME
        value: openGym
      - key: RP_ID
        sync: false
      - key: ORIGIN
        sync: false
      - key: ORIGINS
        sync: false
      - key: DATA_DIR
        value: /tmp/opengym-data

  # OpenGym Frontend Application (Static Site on Free Tier)
  - type: web
    name: opengym-frontend
    runtime: static
    plan: free
    buildCommand: npm install && npm --prefix frontend run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
